name: klieg
label: Klieg
kind: standalone
version: 0.3.1
author: Lakshaya Sharma (LangerSword)
homepage: https://github.com/LangerSword/hermes-klieg
description: >
  Motion design for Hermes. Klieg gives the agent hands to make motion: author a
  scene - kinetic type, transitions, lower-thirds, logo stings, loops - and render
  it to MP4/GIF locally with klieg_motion, no API keys. The same detached job
  engine drives Blender and other DCC hosts: probe what is installed, run scripts
  inside the host, render frame ranges as resumable jobs that survive the agent's
  shell, and verify the result by the artefact on disk, not the exit code.
  Built-in gates (flash, loop, stats, safe band) measure any frame set without a
  DCC, and the shot ledger seals a job's provenance - scene to frames to encode -
  then checks it for drift. Long GPU work never holds the interactive terminal,
  because that is what kills it.
requires_hermes: ">=0.22.0"
python_dependencies:
  - "numpy>=1.26,<3"
  - "Pillow>=10,<12"
provides_hooks:
  - pre_tool_call
provides_tools:
  - klieg_probe
  - klieg_plan
  - klieg_run
  - klieg_render
  - klieg_jobs
  - klieg_track
  - klieg_gate
  - klieg_publish
  - klieg_scene
  - klieg_session
  - klieg_colour
  - klieg_taste
  - klieg_ledger
  - klieg_motion
